---
# Apache virtual hosts
wiki_fqdn: "wiki.{{ domain }}"
www_fqdn: "www.{{ domain }}"

wiki_root: /var/www/wiki
wordpress_root: /var/www/wordpress

# MediaWiki version to deploy
mediawiki_version: "1.41.1"
mediawiki_download_url: "https://releases.wikimedia.org/mediawiki/1.41/mediawiki-{{ mediawiki_version }}.tar.gz"

# WordPress version to deploy
wordpress_version: "6.5.3"
wordpress_download_url: "https://wordpress.org/wordpress-{{ wordpress_version }}.tar.gz"

# PHP settings
php_packages:
  - php
  - php-mysqlnd
  - php-xml
  - php-mbstring
  - php-intl
  # php-json is not a standalone package on RHEL 9 / PHP 8 — the JSON
  # extension is built into core (provided by php-common).

# Mail (Postfix delivery + Dovecot IMAP retrieval)
# Per-user Maildir under each home directory. The same value is consumed by
# Postfix (home_mailbox) and Dovecot (mail_location) so the two never drift.
mail_spool_dir: Maildir
# IMAP lets users pull their mail programmatically (mutt and similar clients).
# Plaintext on the trusted LAN to mirror the lab's no-TLS posture
# (smtp_use_tls = no in main.cf).
imap_port: 143
