# MariaDB bind address — only internal traffic
mariadb_bind_address: "{{ ansible_host }}"

# NFS / LVM storage
nfs_export_path: /mnt/shared
# Single shared directory that every user's ~/Company_Share mounts, so all
# staff see the same files across servera and serverb.
nfs_share_path: "{{ nfs_export_path }}/Company_Share"

lvm_vg_name: nexcore_vg
lvm_lv_name: shared_lv
lvm_lv_size: 10g

# serverb has no spare disk and its VG is fully allocated, so the PV is a
# sparse file on /home attached through a loop device that is re-created at
# boot by a small systemd unit. Keep the backing file a little larger than the
# LV to leave room for VG metadata.
lvm_backing_file: /home/nexcore-storage.img
lvm_backing_file_size: 11g
lvm_loop_service: nexcore-loopback.service

nfs_allowed_network: "***.***.**.*/**"

# Nightly database backups (consumed by the backup role).
backup_dir: /var/backups/nexcore
backup_hour: "1"
backup_minute: "30"
backup_retention_days: 14
# Databases dumped each night — the application databases above.
backup_databases:
  - "{{ wiki_db_name }}"
  - "{{ wordpress_db_name }}"
