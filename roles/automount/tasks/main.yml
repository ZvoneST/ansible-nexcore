---
- name: Install autofs and NFS client
  ansible.builtin.dnf:
    name:
      - autofs
      - nfs-utils
    state: present

- name: Deploy auto.master entry for per-user mounts
  ansible.builtin.template:
    src: auto.master.j2
    dest: /etc/auto.master.d/nexcore.autofs
    owner: root
    group: root
    mode: '0644'
  notify: Restart autofs

- name: Deploy per-user auto map
  ansible.builtin.template:
    src: auto.company_share.j2
    dest: /etc/auto.company_share
    owner: root
    group: root
    mode: '0644'
  notify: Restart autofs

- name: Enable and start autofs
  ansible.builtin.service:
    name: autofs
    state: started
    enabled: true
